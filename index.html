<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nike — โฮม (Hero Section)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ================= Top Utility Bar ================= -->
  <div class="util">
    <div class="util__container">
      <nav class="util__nav" aria-label="utility">
        <a href="#">ค้นหาร้าน</a>
        <span class="util__sep" aria-hidden="true">|</span>
        <a href="#">ความช่วยเหลือ</a>
        <span class="util__sep" aria-hidden="true">|</span>
        <a href="#">เข้าร่วมกับเรา</a>
        <span class="util__sep" aria-hidden="true">|</span>
        <a href="#">ลงชื่อเข้าใช้</a>
      </nav>
    </div>
  </div>

  <!-- ================= Main Header ================= -->
  <header class="header" role="banner">
    <div class="header__container">
      <!-- Brand -->
      <a class="brand" href="#" aria-label="Nike Home">
        <img class="brand__logo" src="assets/adidasLOGO.png" alt="adidas" />
      </a>

      <!-- Primary Nav -->
      <nav class="primary" aria-label="primary">
        <ul class="primary__list">
          <li><a class="primary__link" href="#">ใหม่และโดดเด่น</a></li>
          <li><a class="primary__link" href="#">ผู้ชาย</a></li>
          <li><a class="primary__link" href="#">ผู้หญิง</a></li>
          <li><a class="primary__link" href="#">เด็ก</a></li>
          <li><a class="primary__link" href="#">ลดราคา</a></li>
          <li><a class="primary__link" href="#">SNKRS</a></li>
        </ul>
      </nav>

      <!-- Actions (Search / Wishlist / Badg) -->
      <div class="actions">
        <form class="search" role="search" aria-label="ค้นหา">
    
          <button class="search__btn" type="button" aria-label="ค้นหา">
            <img src="assets/search.png" alt="ค้นหา" class="search__icon-img" />
          </button>
        </form>

        <button class="icon-btn" aria-label="รายการโปรด">
          <img src="assets/heart.png" alt="รายการโปรด" class="icon-btn__img" />
        </button>
        <button class="icon-btn" aria-label="ตะกร้าสินค้า">
          <img src="assets/backpack.png" alt="ตะกร้าสินค้า" class="icon-btn__img" />
        </button>
      </div>
    </div>
  </header>

  <!-- ================= Promo Strip ================= -->
  <aside class="promo" role="note">
  สมาชิกใหม่รับส่วนลด 15% บน Nike App: ใช้โค้ด <strong>APP15</strong><br>
  <a class="promo__link" href="#">ดาวน์โหลดเลยตอนนี้</a>
  </aside>

  <!-- ================= Hero: Shoe + Athlete ================= -->
  <main>
    <section class="hero" aria-label="แคมเปญรองเท้าวิ่งสีชมพู">
  <!-- คลิปวิดีโอ hero -->
  <video class="hero__img" src="assets/Adidas.mp4" autoplay muted loop playsinline poster="assets/hero-desktop.jpg"></video>
    </section>
  </main>
</body>
</html>
